<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 · 손님 눈으로 본 우리 가게</title>
<meta name="description" content="학생 쇼핑몰 11곳을 손님 5명의 눈으로 살펴봤어요. 잘된 점과 더 좋아질 수 있는 점을 정리했어요.">
<meta property="og:type" content="website">
<meta property="og:title" content="손님 눈으로 본 우리 가게">
<meta property="og:description" content="학생 쇼핑몰 11곳을 손님 5명의 눈으로 살펴봤어요. 잘된 점과 더 좋아질 수 있는 점을 정리했어요.">
<meta property="og:locale" content="ko_KR">
<!-- 카톡 미리보기에 그림까지 띄우려면, 사이트를 올린 뒤 실제 주소로 아래 줄을 채워주세요 -->
<!-- <meta property="og:image" content="https://내아이디.github.io/저장소이름/og.png"> -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<style>
:root{
  --bg:#f6f2ea; --paper:#fffdf8; --ink:#2b2622; --muted:#6f665d; --line:#e6ded1;
  --leaf:#3f6b4f; --leaf-soft:#e7efe8; --sun:#c98a1b; --sun-soft:#fbf1dc; --clay:#b35c3c; --clay-soft:#f8e7df;
  --busy:#d9822b; --care:#3d6f9e; --gift:#c45b7e; --oops:#7b5ea7; --home:#3f6b4f;
  --r:18px; --shadow:0 1px 2px rgba(43,38,34,.05),0 8px 24px rgba(43,38,34,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--leaf)}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;border-radius:8px;z-index:9}
/* hero */
.hero{padding:64px 0 40px;text-align:center}
.hero .tag{display:inline-block;font-size:14px;letter-spacing:.08em;color:var(--leaf);background:var(--leaf-soft);padding:6px 14px;border-radius:999px;margin:0 0 18px}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.25;margin:0 0 14px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0 auto;max-width:640px;font-size:18px}
/* sections */
section.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 28px;margin:0 0 22px}
section.block>h2{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
section.block>.lead{color:var(--muted);margin:0 0 20px}
.note{background:var(--leaf-soft);border-radius:14px;padding:16px 18px;margin:0}
.note--warm{background:var(--sun-soft)}
.note b{color:var(--ink)}
/* personas */
.pcards{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;border-top:5px solid var(--c)}
.pcard--busy{--c:var(--busy)}.pcard--care{--c:var(--care)}.pcard--gift{--c:var(--gift)}.pcard--oops{--c:var(--oops)}.pcard--home{--c:var(--home)}
.pcard__emo{font-size:28px}
.pcard h3{margin:6px 0 4px;font-size:18px}
.pcard p{margin:0;font-size:15px;color:var(--muted)}
.pcard__see{margin-top:10px!important;font-size:14px!important}
.pcard__see b{display:block;color:var(--ink);font-size:13px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:11px 10px;text-align:left;vertical-align:top}
.tbl thead th{font-size:14px;color:var(--muted);font-weight:600}
.tbl .num{text-align:center;font-weight:700;color:var(--leaf);white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl--stars th[scope=col]{text-align:center;font-size:22px;line-height:1.2}
.tbl--stars th[scope=col] span{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.tbl--stars td{text-align:center;color:var(--sun);letter-spacing:1px;white-space:nowrap}
.tbl--stars td.st0{color:#c9c0b2}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0 0;padding:0;list-style:none;color:var(--muted);font-size:15px}
/* common */
.common{margin:0;padding-left:1.1em}
.common li{margin:6px 0}
/* nav */
.chips{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:15px}
.chips a:hover,.chips a:focus{border-color:var(--leaf);color:var(--leaf)}
/* shop cards */
.shop{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden;scroll-margin-top:16px}
.shop>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 20px}
.shop>summary::-webkit-details-marker{display:none}
.shop>summary:focus-visible{outline:3px solid var(--leaf);outline-offset:-3px}
.shop__icon{font-size:32px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--leaf-soft)}
.shop--sun .shop__icon{background:var(--sun-soft)}.shop--clay .shop__icon{background:var(--clay-soft)}
.shop__name{display:block;font-weight:800;font-size:20px}
.shop__sum{display:block;color:var(--muted);font-size:15px;line-height:1.55}
.shop__score{display:grid;place-items:center;width:70px;height:70px;border-radius:50%;border:4px solid var(--leaf);background:#fff}
.shop--sun .shop__score{border-color:var(--sun)}.shop--clay .shop__score{border-color:var(--clay)}
.shop__score b{font-size:24px;line-height:1}.shop__score small{font-size:11px;color:var(--muted);margin-top:-14px}
.shop>summary::after{content:"펼쳐 보기 ▾";grid-column:1/-1;justify-self:center;font-size:13px;color:var(--muted)}
.shop[open]>summary::after{content:"접기 ▴"}
.shop__body{padding:4px 22px 24px;border-top:1px dashed var(--line)}
.shop__body h4{font-size:17px;margin:22px 0 10px}
.shop__link{margin:16px 0 0}
.shop__link a{font-weight:700;text-decoration:none}
/* persona bars */
.pbars{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pbar__head{display:flex;justify-content:space-between;font-weight:700}
.pbar__num{font-size:20px}
.pbar__track{height:10px;background:#efe9df;border-radius:999px;overflow:hidden;margin:6px 0 8px}
.pbar__track span{display:block;height:100%;background:var(--c);border-radius:999px}
.pbar--busy{--c:var(--busy)}.pbar--care{--c:var(--care)}.pbar--gift{--c:var(--gift)}.pbar--oops{--c:var(--oops)}.pbar--home{--c:var(--home)}
.pbar__say{margin:0;color:var(--muted);font-size:15px}
/* mini item grid */
.mini{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini__k{display:block;font-size:13px;color:var(--muted)}
.mini__v{display:block;font-size:15px}.mini__v b{font-size:19px}
.mini__t{display:block;height:6px;background:#efe9df;border-radius:999px;margin-top:6px;overflow:hidden}
.mini__t span{display:block;height:100%;background:var(--leaf)}
/* good / better */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.twocol section{border-radius:14px;padding:4px 16px 12px}
.good{background:var(--leaf-soft)}.better{background:var(--sun-soft)}
.good ul{padding-left:1.1em;margin:0}.good li{margin:6px 0}
.better ul{list-style:none;padding:0;margin:0}
.better li{display:grid;grid-template-columns:24px 1fr;gap:4px;margin:8px 0}
/* paused */
.paused{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.paused li{display:flex;gap:12px;background:#fff;border:1px dashed #d8c9b3;border-radius:14px;padding:16px}
.paused li>span{font-size:28px}
.paused p{margin:2px 0 6px;color:var(--muted);font-size:15px}
footer{padding:30px 0 60px;text-align:center;color:var(--muted);font-size:14px}
.top{position:fixed;right:16px;bottom:16px;background:var(--leaf);color:#fff;text-decoration:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
@media (max-width:720px){
  body{font-size:16px}
  section.block{padding:22px 18px}
  .shop>summary{grid-template-columns:auto 1fr;padding:16px}
  .shop__score{grid-column:1/-1;justify-self:start;width:auto;height:auto;border-radius:999px;border-width:3px;padding:4px 14px;display:flex;gap:8px;align-items:baseline}
  .shop__score small{margin:0}
  .shop__icon{width:44px;height:44px;font-size:26px}
  .shop__body{padding:4px 16px 20px}
  .mini{grid-template-columns:repeat(2,1fr)}
  .twocol{grid-template-columns:1fr}
}
@media print{.top,.chips{display:none}.shop{break-inside:avoid}details>*{display:block}}
</style>
</head>
<body>
<main class="wrap" style="min-height:80vh;display:grid;place-items:center;text-align:center">
  <section class="block" style="max-width:520px">
    <p style="font-size:56px;margin:0">🧭</p>
    <h1 style="margin:8px 0 10px;font-size:28px">앗, 길을 잃었어요</h1>
    <p style="color:var(--muted);margin:0 0 22px">찾으시는 페이지가 없어요. 주소가 바뀌었거나 잘못 입력되었을 수 있어요.</p>
    <p style="margin:0"><a href="./" style="display:inline-block;background:var(--leaf);color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700">처음 화면으로 가기</a></p>
  </section>
</main>
</body>
</html>
